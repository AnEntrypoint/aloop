# Assemble the flashable Alpine SD image for every supported Raspberry Pi board.
#
# WHY in CI: the device image must be reproducible — a fresh checkout produces the
# same image. This job pulls the aloop binary + the home-FX LV2 bundle from the
# other workflows and runs image/build-image.sh (the SINGLE source of the device
# layout, now BOARD-parameterized) once per board in a build matrix, then validates
# each image without a Pi, and a final job publishes every board's artifacts to one
# shared rolling "latest" GitHub Release.
name: build-image

on:
  workflow_run:
    workflows: ["build-binary"]
    types: [completed]
  push:
    paths:
      - 'image/**'
      - 'kernel/**'
      - 'src/**'
      - 'dsp/**'
      - 'config/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alpine-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [pi3, pi4, pi5, opi-prime]
    steps:
      - uses: actions/checkout@v4

      # mtools/dosfstools/fdisk cover the Pi boards' unprivileged FAT assembly;
      # e2fsprogs (mkfs.ext4) + xz-utils + util-linux (losetup) cover Orange Pi
      # Prime's Armbian-sourced raw-U-Boot + ext4-root image assembly, which needs
      # real root (sudo losetup/mount) unlike the Pi boards' mtools path.
      # u-boot-tools (mkimage) compiles boot.scr -- Armbian's compiled U-Boot
      # bootcmd sources this file directly by fixed filename and never touches
      # extlinux.conf, confirmed via real hardware debugging this session.
      - name: Tools (mtools, dosfstools, fdisk, e2fsprogs, xz, u-boot-tools, file — image assembly)
        run: sudo apt-get update && sudo apt-get install -y mtools dosfstools fdisk e2fsprogs xz-utils util-linux u-boot-tools curl gzip file zip

      # Pull the aloop binary + LV2 bundle produced by build-binary / build-lv2.
      # They live in DIFFERENT workflows' runs, so fetch each from the latest
      # SUCCESSFUL run of its workflow via gh (a workflow_run trigger only carries
      # its own run's artifacts). Missing artifacts don't fail the image build — it
      # still produces a valid bootable layout — but the validate step WARNS, and a
      # release build requires them. Same binary/LV2 for every board — the aloop
      # payload itself is architecture-independent aarch64 userspace content; only
      # the boot firmware/DTB/USB-gadget config differs per board.
      - name: Download aloop binary + LV2 bundles from their latest green runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dl/bin dl/lv2
          BIN_RUN=$(gh run list --workflow build-binary.yml --status success \
                    --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          LV2_RUN=$(gh run list --workflow build-lv2.yml --status success \
                    --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          echo "binary run: ${BIN_RUN:-none}   lv2 run: ${LV2_RUN:-none}"
          [ -n "$BIN_RUN" ] && gh run download "$BIN_RUN" -n aloop-aarch64-musl -D dl/bin || echo "no binary artifact yet"
          # BOTH lv2 jobs from the SAME build-lv2.yml run: home-fx-lv2 (contains
          # aloop.lv2, EXCLUDED by lib-boot-tree.sh's own name filter, see its
          # comment) and guitar-lofi-fx-lv2 (contains guitar_lofi_fx.lv2, the
          # actual wanted standalone effect). Downloading only home-fx-lv2 here
          # meant every image this workflow ever built shipped with ZERO home-FX
          # LV2 effects, silently, since aloop.lv2 was the only bundle present
          # and it's deliberately filtered back out -- fixed by fetching both
          # into sibling dirs under dl/lv2, matching the find -maxdepth 2 shape
          # lib-boot-tree.sh's boot_tree_apkovl expects.
          [ -n "$LV2_RUN" ] && gh run download "$LV2_RUN" -n home-fx-lv2 -D dl/lv2/home-fx-lv2 || echo "no home-fx-lv2 artifact yet"
          [ -n "$LV2_RUN" ] && gh run download "$LV2_RUN" -n guitar-lofi-fx-lv2 -D dl/lv2/guitar-lofi-fx-lv2 || echo "no guitar-lofi-fx-lv2 artifact yet"
          find dl -type f | head -20

      - name: Locate payload
        id: payload
        run: |
          BIN=$(find dl/bin -type f -name aloop 2>/dev/null | head -n1 || true)
          LV2DIR=""; [ -d dl/lv2 ] && [ -n "$(find dl/lv2 -maxdepth 2 -name '*.lv2' -type d 2>/dev/null)" ] && LV2DIR="dl/lv2"
          echo "bin=$BIN"   >> "$GITHUB_OUTPUT"
          echo "lv2dir=$LV2DIR" >> "$GITHUB_OUTPUT"
          echo "found binary: '${BIN:-<none>}'  lv2 dir: '${LV2DIR:-<none>}'"
          find dl/lv2 -maxdepth 2 -name '*.lv2' -type d 2>/dev/null

      - name: Build the flashable image (image/build-image.sh)
        env:
          ALOOP_BIN: ${{ steps.payload.outputs.bin }}
          LV2_DIR: ${{ steps.payload.outputs.lv2dir }}
          BOARD: ${{ matrix.board }}
          OUT: aloop-${{ matrix.board }}.img
        run: |
          chmod +x image/build-image.sh
          image/build-image.sh
          gzip -9 -k aloop-${{ matrix.board }}.img
          ls -la aloop-${{ matrix.board }}.img aloop-${{ matrix.board }}.img.gz

      - name: Validate the image without a Pi (partition + boot files + overlay)
        env:
          BOARD: ${{ matrix.board }}
        run: |
          chmod +x image/validate-image.sh
          image/validate-image.sh aloop-${{ matrix.board }}.img

      # The netboot root is the SAME diskless tree (shared image/lib-boot-tree.sh),
      # laid into a plain TFTP directory instead of a FAT image — the pre-SD dry-run
      # path (docs/NETBOOT.md). Build + structurally validate it in CI so it can
      # never drift from the SD image or silently rot.
      # SKIPPED for opi-prime: Allwinner's BootROM has no equivalent of the Pi's
      # native TFTP+HTTP netboot firmware -- U-Boot must already be resident on
      # local media (SD/eMMC/SPI) before PXE/TFTP can even be reached, so there is
      # no "drop-in" netboot root to build the way there is for the Pi family
      # (opi-netboot-feasibility). OPi Prime is SD-card-flash-only for now.
      - name: Build + validate the TFTP netboot root
        if: matrix.board != 'opi-prime'
        env:
          ALOOP_BIN: ${{ steps.payload.outputs.bin }}
          LV2_DIR: ${{ steps.payload.outputs.lv2dir }}
          BOARD: ${{ matrix.board }}
          OUT: aloop-netboot-${{ matrix.board }}
        run: |
          chmod +x image/build-netboot.sh image/validate-netboot.sh
          image/build-netboot.sh
          image/validate-netboot.sh aloop-netboot-${{ matrix.board }}
          tar -czf aloop-netboot-${{ matrix.board }}.tar.gz aloop-netboot-${{ matrix.board }}
          ls -la aloop-netboot-${{ matrix.board }}.tar.gz

      - name: Upload flashable image
        uses: actions/upload-artifact@v4
        with:
          name: aloop-${{ matrix.board }}-image
          path: aloop-${{ matrix.board }}.img.gz
          if-no-files-found: error
          # WITNESSED: this workflow re-runs on nearly every push (build-binary
          # completion + any image/kernel/src/dsp/config push), and these two
          # image artifacts run ~68MB+ each -- with the repo's default 90-day
          # retention, a single active session's worth of pushes (100+ over a
          # few hours) accumulated to 6.8GB+ and hit the account's total
          # Actions artifact storage quota, blocking EVERY workflow's artifact
          # upload repo-wide (including build-binary's much smaller binary)
          # until the quota "recalculates" on GitHub's own 6-12h cycle. A
          # short retention keeps this from recurring; these are dev-iteration
          # artifacts, not release assets meant to be kept.
          retention-days: 3

      - name: Upload netboot root
        if: matrix.board != 'opi-prime'
        uses: actions/upload-artifact@v4
        with:
          name: aloop-${{ matrix.board }}-netboot-root
          path: aloop-netboot-${{ matrix.board }}.tar.gz
          if-no-files-found: error
          retention-days: 3

      # Zip of the SAME validated FAT partition contents (firmware + kernel +
      # DTBs + apkovl + SD-flavored config, no ip=dhcp) for direct extraction
      # onto a freshly-formatted FAT32 SD card -- the format-in-place flow
      # (format E: FAT32, unzip onto it) rather than the raw-dd aloop-<board>.img.gz
      # path above. Extracted straight out of the already-built+validated
      # image via the same mtools offset-view validate-image.sh uses,
      # so this can never independently drift from what was actually validated.
      # SKIPPED for opi-prime: its image is a raw-U-Boot-sector + ext4 layout, not
      # a single FAT partition mtools can read -- flashing is dd-only for this
      # board (the .img.gz artifact already covers that; there is no separate
      # "format+extract zip" flow to offer since there's no FAT partition to zip).
      - name: Extract SD boot tree from the validated image and zip it
        if: matrix.board != 'opi-prime'
        run: |
          OFF=$((2048 * 512))
          MT=$(mktemp)
          printf 'drive z: file="%s/aloop-%s.img" offset=%s\n' "$PWD" "${{ matrix.board }}" "$OFF" > "$MT"
          export MTOOLSRC="$MT"
          rm -rf sd-boot-tree
          mkdir -p sd-boot-tree
          mcopy -s z:/ sd-boot-tree/
          ls -la sd-boot-tree | head -20
          (cd sd-boot-tree && zip -r -9 -q ../aloop-${{ matrix.board }}-sdcard.zip .)
          ls -la aloop-${{ matrix.board }}-sdcard.zip

      - name: Upload SD card zip
        if: matrix.board != 'opi-prime'
        uses: actions/upload-artifact@v4
        with:
          name: aloop-${{ matrix.board }}-sdcard
          path: aloop-${{ matrix.board }}-sdcard.zip
          if-no-files-found: error
          retention-days: 3

      # A release must never publish a payload-less "layout only" build as
      # "latest" -- image/validate-image.sh deliberately WARNS (not FAILS) on a
      # missing binary/LV2, since that's a legitimate structural-only build. The
      # release step needs a stricter, hard gate: refuse to publish unless a
      # real aarch64 binary was actually bundled this run.
      - name: Assert the image actually carries a real payload before releasing
        id: payload_check
        run: |
          if [ -z "${{ steps.payload.outputs.bin }}" ]; then
            echo "no aloop binary was found this run -- refusing to publish a payload-less release" >&2
            echo "has_payload=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_payload=true" >> "$GITHUB_OUTPUT"
          fi

    outputs:
      has_payload: ${{ steps.payload_check.outputs.has_payload }}

  release:
    needs: alpine-image
    if: |
      needs.alpine-image.outputs.has_payload == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      # Matrix jobs cannot share files directly -- each board's image/sdcard-zip
      # artifacts from the alpine-image matrix round-trip through actions/upload
      # -artifact, so this job downloads all of them by their per-board names
      # before publishing one shared release carrying every board's assets.
      - name: Download every board's image + SD card zip
        uses: actions/download-artifact@v4
        with:
          pattern: aloop-*-image
          path: dl
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: aloop-*-sdcard
          path: dl
          merge-multiple: true
      - name: List gathered release assets
        run: ls -la dl/

      - name: Publish rolling "latest" GitHub Release with every board's images
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: aloop latest (auto-updated on every green main build)
          body: |
            Automatically rebuilt SD card images on every successful push to `main`.
            Commit: ${{ github.sha }}

            One image per supported board — flash the one matching your hardware.

            **aloop-<board>-sdcard.zip** — extract onto a freshly-formatted FAT32 SD card
            (firmware + kernel + DTBs + apkovl + config, ready to boot).

            **aloop-<board>.img.gz** — raw dd-able image (`dd if=aloop-<board>.img of=/dev/sdX bs=4M conv=fsync`
            after `gunzip`, or Raspberry Pi Imager / balenaEtcher).

            Supported boards this release: pi3, pi4, pi5 (SD card zip + raw image),
            opi-prime (Orange Pi Prime, Allwinner H5 — raw `dd`-able image only,
            no SD card zip: its boot layout is raw U-Boot sectors + an ext4 root
            partition, not a single FAT partition, so there's no "format+extract"
            flow to offer for it).
          prerelease: true
          make_latest: true
          files: |
            dl/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
