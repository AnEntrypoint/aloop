name: pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Pages site root
        run: |
          rm -rf _site_src
          mkdir -p _site_src
          cp -r docs/. _site_src/
          cp AGENTS.md _site_src/AGENTS.md
          cp docs/demo/index.html _site_src/index.html
          cat > _site_src/docs.md << 'DOCSEOF'
          ---
          title: aloop — design record
          ---

          # aloop

          Real-time C++/Faust audio looper for Raspberry Pi / Orange Pi hardware.

          [Control surface demo](.)

          - [Design record index](README.md)
          - [AGENTS.md — technical constraints reference](AGENTS.md)
          DOCSEOF
          cat > _site_src/_config.yml << 'CFGEOF'
          title: aloop
          theme: jekyll-theme-minimal
          markdown: kramdown
          include:
            - AGENTS.md
          exclude:
            - demo
          CFGEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: _site_src
          destination: _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
