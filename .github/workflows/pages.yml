name: pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'dsp/**'
      - 'effects/**'
      - 'AGENTS.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Pages site root
        run: |
          rm -rf _site_src
          mkdir -p _site_src
          cp -r docs/. _site_src/
          cp AGENTS.md _site_src/AGENTS.md
          cp -r docs/demo/. _site_src/
          mkdir -p _site_src/dsp _site_src/effects
          cp -r dsp/. _site_src/dsp/
          cp -r effects/. _site_src/effects/
          cat > _site_src/docs.md << 'DOCSEOF'
          ---
          title: aloop — design record
          ---

          # aloop

          Real-time C++/Faust audio looper for Raspberry Pi / Orange Pi hardware.

          [Control surface demo](.)

          - [Design record index](README.md)
          - [AGENTS.md — technical constraints reference](AGENTS.md)
          DOCSEOF
          cat > _site_src/_config.yml << 'CFGEOF'
          title: aloop
          theme: jekyll-theme-minimal
          markdown: kramdown
          include:
            - AGENTS.md
          exclude:
            - demo
          CFGEOF

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: _site_src
          destination: _site

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
