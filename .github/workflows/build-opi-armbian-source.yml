name: build-opi-armbian-source

on:
  workflow_dispatch:

jobs:
  build-armbian-opi-prime:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout armbian/build pinned to the last pre-6.18 sunxi64 current-branch commit
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: be0bd46058e23cfdad66e840198dda157b998db5
          path: armbian-build
          fetch-depth: 1

      - name: Free up disk space (Armbian's build needs ~50GB, GH-hosted runners are tight)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - uses: docker/setup-qemu-action@v3

      - name: Verify this checkout genuinely resolves to kernel 6.12, not 6.18
        working-directory: armbian-build
        run: |
          grep -A2 'current)' config/sources/families/include/sunxi64_common.inc
          grep -A2 'current)' config/sources/families/include/sunxi64_common.inc | grep -q '"6.12"'

      - name: Disable known-broken unrelated-hardware patch entries in series.conf (Rockchip SPI, Cedrus)
        working-directory: armbian-build
        run: |
          SERIES=patch/kernel/archive/sunxi-6.12/series.conf
          sed -i -E \
            -e 's#^([[:space:]]*)(patches\.megous/spi-rockchip-Fix-runtime-PM-and-other-issues\.patch)$#\1-\2#' \
            -e 's#^([[:space:]]*)(patches\.megous/spi-fixes\.patch)$#\1-\2#' \
            -e 's#^([[:space:]]*)(patches\.megous/media-cedrus-Fix-failure-to-clean-up-hardware-on-probe-failure\.patch)$#\1-\2#' \
            "$SERIES"
          grep -E 'spi-rockchip-Fix-runtime-PM|spi-fixes\.patch|media-cedrus-Fix-failure' "$SERIES"

      - name: Disable unrelated Realtek USB WiFi driver configs that fail -Werror=incompatible-pointer-types against 6.12's cfg80211_ops signature
        working-directory: armbian-build
        run: |
          CFG=config/kernel/linux-sunxi64-current.config
          sed -i -E \
            -e 's/^CONFIG_RTL8189ES=m$/# CONFIG_RTL8189ES is not set/' \
            -e 's/^CONFIG_RTL8189FS=m$/# CONFIG_RTL8189FS is not set/' \
            -e 's/^CONFIG_RTL8192EU=m$/# CONFIG_RTL8192EU is not set/' \
            "$CFG"
          grep -E 'CONFIG_RTL8189ES|CONFIG_RTL8189FS|CONFIG_RTL8192EU' "$CFG"

      - name: Build a minimal Orange Pi Prime image via Armbian's own build script
        working-directory: armbian-build
        run: |
          ./compile.sh build BOARD=orangepiprime BRANCH=current RELEASE=trixie \
            BUILD_MINIMAL=yes BUILD_DESKTOP=no KERNEL_CONFIGURE=no

      - name: Locate the built image
        id: locate
        working-directory: armbian-build
        run: |
          IMG=$(find output/images -iname 'Armbian*orangepiprime*.img*' | head -n1)
          echo "img=$IMG" >> "$GITHUB_OUTPUT"
          ls -la output/images/

      - name: Upload the built image
        uses: actions/upload-artifact@v4
        with:
          name: armbian-opi-prime-pre618-image
          path: armbian-build/${{ steps.locate.outputs.img }}
          if-no-files-found: error
          retention-days: 7
