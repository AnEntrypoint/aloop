# aloop STA-mode config. autoAP joins one of these networks when available and
# falls back to hosting the AP (hostapd.conf) when none are.
#
# `ticker` is the SINGLE shared mesh SSID both aloop and ../esp-idf-link host
# and join — an OPEN network (key_mgmt=NONE), matching esp-idf-link's own
# wifi_connect_sta("ticker", "") empty-password join and aloop's own open
# hostapd.conf. Securing it means changing BOTH projects at once or they
# silently stop meshing — see AGENTS.md "aloop <-> esp-idf-link mesh: paired
# invariants".
#
# priority: higher wins, so the mesh is preferred over any infrastructure
# network appended below it.
ctrl_interface=/var/run/wpa_supplicant
update_config=1
country=US

network={
    ssid="ticker"
    key_mgmt=NONE
    priority=10
}
